[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "industrial-streaming-mlops"
version = "0.1.0"
description = "Traceable maintenance alerts from Kafka telemetry, Spark and MLflow"
requires-python = ">=3.11,<3.13"
dependencies = [
  "kafka-python==2.3.2",
  "mlflow==3.17.2",
  "numpy==2.3.5",
  "pandas==2.2.3",
  "pyspark==3.5.9",
  "scikit-learn==1.8.0",
]

[project.scripts]
industrial-mlops = "industrial_mlops.cli:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff==0.14.5",
    "build==1.3.0",
    "pip-audit==2.9.0",
    "jsonschema==4.26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/industrial_mlops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires real external services", "load: bounded workload measurement"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
