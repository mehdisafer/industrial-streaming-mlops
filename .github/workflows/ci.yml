name: Verify local reference

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  MLFLOW_DISABLE_TELEMETRY: "true"
  DO_NOT_TRACK: "true"

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      integration: ${{ steps.scope.outputs.integration }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select meaningful integration changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os, subprocess
          base = os.environ.get('BASE_SHA', '')
          head = os.environ.get('HEAD_SHA', 'HEAD')
          if not base or set(base) == {'0'} or os.environ['EVENT_NAME'] == 'workflow_dispatch':
              run = True
          else:
              paths = subprocess.check_output(['git', 'diff', '--name-only', base, head], text=True).splitlines()
              exact = {'pyproject.toml', 'uv.lock', 'compose.yaml', 'databricks.yml'}
              prefixes = ('src/', 'tests/', 'config/', 'schemas/', 'scripts/', 'infra/', 'databricks/', 'resources/', '.github/workflows/')
              run = any(path in exact or path.startswith(prefixes) for path in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('integration=' + str(run).lower() + '\n')
          PY
      - name: Install pinned tooling and locked Python environment
        run: |
          python -m pip install uv==0.13.6
          uv python install 3.11.18
          uv sync --frozen --all-extras --python 3.11.18
      - name: Compile source and provider entrypoints
        run: uv run --frozen python -m compileall -q src databricks scripts
      - name: Unit, contract and temporal correctness tests
        run: |
          mkdir -p evidence/ci
          uv run --frozen pytest -q -m 'not integration' --junitxml=evidence/ci/tests.xml
      - name: Secret patterns, Git history and component license inventory
        run: uv run --frozen python scripts/security_inventory.py --scan-history --output evidence/ci/security-inventory.json
      - name: Dependency advisories
        run: uv run --frozen pip-audit --skip-editable --format json --output evidence/ci/dependency-audit.json
      - name: Record environment
        if: always()
        run: |
          mkdir -p evidence/ci
          git rev-parse HEAD > evidence/ci/commit.txt
          uv pip freeze > evidence/ci/python-packages.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: checks-${{ github.sha }}
          path: evidence/ci/
          retention-days: 14
          if-no-files-found: warn

  real-integration:
    needs: checks
    if: needs.checks.outputs.integration == 'true'
    concurrency:
      group: integration-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: industrial-ci-${{ github.run_id }}-${{ github.run_attempt }}
      SOURCE_REVISION: ${{ github.sha }}
      EVIDENCE_DIR: evidence/integration
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate container configuration
        run: docker compose config --quiet
      - name: Real Kafka, Spark and MLflow integration
        run: bash scripts/integration.sh
      - name: Capture original container output and image identities
        if: always()
        run: |
          mkdir -p evidence/integration
          if test -f evidence/integration/.owns-compose-project &&
             test "$(cat evidence/integration/.owns-compose-project)" = "$COMPOSE_PROJECT_NAME" &&
             ! test -f evidence/integration/.cleanup-complete; then
            docker compose --project-name "$COMPOSE_PROJECT_NAME" ps --all --format json > evidence/integration/ci-fallback-containers.json || true
            docker compose --project-name "$COMPOSE_PROJECT_NAME" logs --no-color > evidence/integration/ci-fallback-container.log 2>&1 || true
            docker image inspect industrial-streaming-mlops:local apache/kafka:3.9.2 > evidence/integration/ci-fallback-images.json || true
          fi
          git rev-parse HEAD > evidence/integration/commit.txt
      - name: Stop the isolated stack
        if: always()
        run: |
          if test -f evidence/integration/.owns-compose-project &&
             test "$(cat evidence/integration/.owns-compose-project)" = "$COMPOSE_PROJECT_NAME" &&
             ! test -f evidence/integration/.cleanup-complete; then
            docker compose --project-name "$COMPOSE_PROJECT_NAME" --profile streaming --profile tools down --timeout 45 > evidence/integration/ci-fallback-cleanup.log 2>&1
            printf '%s\n' "$COMPOSE_PROJECT_NAME" > evidence/integration/.cleanup-complete
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: integration-${{ github.sha }}
          path: evidence/integration/
          retention-days: 14
          if-no-files-found: warn
