name: industrial-streaming-mlops

x-app: &app
  image: industrial-streaming-mlops:local
  build:
    context: .
    dockerfile: infra/Dockerfile
    args:
      SOURCE_REVISION: ${SOURCE_REVISION:-unrecorded}
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 45s
  tmpfs:
    - /tmp:rw,nosuid,size=1073741824,uid=10001,gid=10001
  volumes:
    - state:/state
  networks: [pipeline]
  environment: &app-env
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MLFLOW_HTTP_REQUEST_TIMEOUT: "5"
    MLFLOW_HTTP_REQUEST_MAX_RETRIES: "0"
    MLFLOW_DISABLE_AGENT_HINT: "1"
    PIPELINE_DB: /state/pipeline/monitor.db
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    KAFKA_TOPIC: ${KAFKA_TOPIC:-telemetry}
    CHECKPOINT_DIR: /state/checkpoints
    SPARK_LOCAL_IP: 127.0.0.1
    SPARK_MASTER: local[2]
    SPARK_KAFKA_PRELOADED: "1"
    OPENBLAS_NUM_THREADS: "1"
    OMP_NUM_THREADS: "1"

services:
  state-init:
    <<: *app
    user: "0:0"
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mkdir -p /state/mlflow/artifacts /state/pipeline /state/checkpoints /state/input /state/training /state/evidence /kafka-data;
        chown 10001:10001 /state /state/mlflow /state/mlflow/artifacts /state/pipeline /state/checkpoints /state/input /state/training /state/evidence;
        chown 1000:1000 /kafka-data
    volumes:
      - state:/state
      - kafka-data:/kafka-data
    cpus: 0.25
    mem_limit: 128m
    restart: "no"

  kafka:
    image: apache/kafka:3.9.2
    hostname: kafka
    user: "1000:1000"
    depends_on:
      state-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:19092:19092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_NUM_PARTITIONS: ${KAFKA_PARTITIONS:-3}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: "72"
      KAFKA_LOG_RETENTION_BYTES: "268435456"
      KAFKA_LOG_SEGMENT_BYTES: "67108864"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [pipeline]
    cpus: 1.5
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 45s
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, kafka:9092, --list]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  topics:
    image: apache/kafka:3.9.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [/opt/kafka/bin/kafka-topics.sh]
    command: [--bootstrap-server, kafka:9092, --create, --if-not-exists, --topic, "${KAFKA_TOPIC:-telemetry}", --partitions, "${KAFKA_PARTITIONS:-3}", --replication-factor, "1"]
    networks: [pipeline]
    cpus: 0.5
    mem_limit: 256m
    restart: "no"

  mlflow:
    <<: *app
    entrypoint: ["/usr/bin/tini", "--", "mlflow"]
    command: [server, --host, 0.0.0.0, --port, "5000", --workers, "1", --backend-store-uri, "sqlite:////state/mlflow/mlflow.db", --artifacts-destination, /state/mlflow/artifacts, --allowed-hosts, "mlflow:5000,localhost:5000,127.0.0.1:5000"]
    depends_on:
      state-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5000:5000"
    cpus: 1
    mem_limit: 1g
    pids_limit: 128
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5).read()"]
      interval: 10s
      timeout: 6s
      retries: 18
      start_period: 30s

  worker:
    <<: *app
    profiles: [streaming]
    command: [stream, --workers, "2", --max-offsets, "1000"]
    depends_on:
      topics:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
    cpus: 2
    mem_limit: 4g
    pids_limit: 512
    restart: "no"

  dashboard:
    <<: *app
    command: [dashboard, --host, 0.0.0.0, --port, "8080"]
    depends_on:
      state-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64

  cli:
    <<: *app
    profiles: [tools]
    depends_on:
      topics:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
    cpus: 2
    mem_limit: 4g
    pids_limit: 512

volumes:
  state:
  kafka-data:

networks:
  pipeline:
    internal: true
