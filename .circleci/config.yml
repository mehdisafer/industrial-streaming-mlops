version: 2.1
orbs:
  browser-tools: circleci/browser-tools@2.4.2
jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - restore_cache:
          keys:
            - industrial-uv-v1-{{ checksum "uv.lock" }}
      - run:
          name: Install locked Python environment
          command: |
            python -m pip install --disable-pip-version-check uv==0.13.6
            uv sync --frozen --all-extras --python 3.11
      - save_cache:
          key: industrial-uv-v1-{{ checksum "uv.lock" }}
          paths:
            - .venv
            - ~/.cache/uv
      - run:
          name: Compile Python sources
          command: uv run --frozen python -m compileall -q src databricks scripts
      - run:
          name: Lint
          command: uv run --frozen ruff check src tests scripts
      - run:
          name: Diagnose test suite
          command: circleci testsuite doctor "python-unit"
      - run:
          name: Run test suite
          command: circleci testsuite run "python-unit"
      - store_test_results:
          path: test-results
  dashboard-browser:
    machine:
      image: ubuntu-2404:2026.10.1
    resource_class: medium
    steps:
      - checkout
      - browser-tools/install_chrome
      - run:
          name: Qualify rendered desktop, narrow and HTTP outage dashboard views
          no_output_timeout: 10m
          command: bash scripts/dashboard_browser_smoke.sh
      - store_artifacts:
          path: evidence/browser
          destination: dashboard-browser
workflows:
  build-and-test:
    jobs:
      - build-and-test
      - dashboard-browser:
          requires:
            - build-and-test
