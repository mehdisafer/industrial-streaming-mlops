version: 2.1
orbs:
  browser-tools: circleci/browser-tools@2.4.2
jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - restore_cache:
          keys:
            - industrial-uv-v1-{{ checksum "uv.lock" }}
      - run:
          name: Install locked Python environment
          command: |
            python -m pip install --disable-pip-version-check uv==0.13.6
            uv sync --frozen --all-extras --python 3.11
      - save_cache:
          key: industrial-uv-v1-{{ checksum "uv.lock" }}
          paths:
            - .venv
            - ~/.cache/uv
      - run:
          name: Compile Python sources
          command: uv run --frozen python -m compileall -q src databricks scripts
      - run:
          name: Lint
          command: uv run --frozen ruff check src tests scripts
      - run:
          name: Diagnose test suite
          command: circleci testsuite doctor "python-unit"
      - run:
          name: Run test suite
          command: circleci testsuite run "python-unit"
      - store_test_results:
          path: test-results
      - run:
          name: Verify RC lock, build wheel and inspect Apache-2.0 metadata
          command: |
            uv lock --check
            mkdir -p artifacts/release-candidate
            uv build --wheel --out-dir artifacts/release-candidate
            uv run --frozen python scripts/check_release_candidate.py \
              --wheel-dir artifacts/release-candidate \
              --output artifacts/release-candidate/inspection.json
      - store_artifacts:
          path: artifacts/release-candidate
          destination: release-candidate
  dashboard-browser:
    machine:
      image: ubuntu-2404:2026.10.1
    resource_class: medium
    steps:
      - checkout
      - browser-tools/install_chrome
      - run:
          name: Qualify rendered desktop, narrow and HTTP outage dashboard views
          no_output_timeout: 10m
          command: bash scripts/dashboard_browser_smoke.sh
      - store_artifacts:
          path: evidence/browser
          destination: dashboard-browser
  publication-security:
    # Source-only security check; no Docker daemon, model training or paid cloud.
    docker:
      - image: cimg/python:3.11
    resource_class: small
    steps:
      - checkout
      - run:
          name: Fetch and identify visible branch/tag history
          command: |
            mkdir -p artifacts/publication-security
            git rev-parse HEAD > artifacts/publication-security/checkout-sha.txt
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              git fetch --no-tags --prune --unshallow origin '+refs/heads/*:refs/remotes/origin/*'
            else
              git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
            fi
            git fetch --tags origin
            test "$(git rev-parse --is-shallow-repository)" = "false"
            git rev-list --all --count > artifacts/publication-security/reachable-commits.txt
            test "$(cat artifacts/publication-security/reachable-commits.txt)" -gt 0
            git for-each-ref --format='%(refname)' refs/remotes/origin refs/tags > artifacts/publication-security/visible-refs.txt
      - run:
          name: Install pinned and locked Python dependencies
          command: |
            python -m pip install --disable-pip-version-check uv==0.13.6
            uv sync --frozen --all-extras --python 3.11
      - run:
          name: Scan sources, history and installed license declarations
          command: |
            uv run --frozen python scripts/security_inventory.py --scan-history --output artifacts/publication-security/security-inventory.json
            uv run --frozen python - \<<'PY'
            import json
            from pathlib import Path
            report = json.loads(Path('artifacts/publication-security/security-inventory.json').read_text())
            secrets = report['secrets']
            assert secrets['history_requested'] is True
            assert secrets['history_blobs_inspected'] > 0
            assert not secrets['findings'], 'Unresolved potential secret findings'
            assert report['inventory']['components'], 'Missing component inventory'
            print(json.dumps({
                'history_blobs_inspected': secrets['history_blobs_inspected'],
                'files_inspected': secrets['worktree_files_inspected'],
                'unscanned_files_recorded': len(secrets['skipped']),
                'inventory_components': len(report['inventory']['components']),
            }))
            PY
      - run:
          name: Audit installed dependencies against published advisories
          when: always
          command: |
            if [ -x .venv/bin/pip-audit ]; then
              uv run --frozen pip-audit --skip-editable --format json --output artifacts/publication-security/dependency-audit.json
            else
              echo 'Dependency audit unavailable because locked environment installation failed'
              exit 2
            fi
      - store_artifacts:
          path: artifacts/publication-security
          destination: publication-security

workflows:
  build-and-test:
    jobs:
      - build-and-test
      - publication-security
      - dashboard-browser:
          requires:
            - build-and-test
